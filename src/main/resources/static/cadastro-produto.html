<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - GameStorage</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/tema.js"></script>
</head>
<body>
    <header>
        <h1>GameStorage</h1>
        <nav>
            <a href="index.html" class="ativo">Início</a>
            <a href="config.html">Configurações</a>
            <a href="login.html">Login</a>
        </nav>
    </header>


    <main>
        <h2>Cadastrar Produto</h2>
        
        <form id="form-produto" class="formulario" novalidate>
            <label for="nome">Nome:</label>
              <input type="text" id="nome">
            <span class="erro" id="erro-nome"></span>


            <label for="categoria">Tipo:</label>
            <input type="text" id="categoria" list="lista-tipos">
            <datalist id="lista-tipos"></datalist>
            <span class="erro" id="erro-categoria"></span>

            <label for="marca">Marca:</label>
            <input type="text" id="marca">
            <span class="erro" id="erro-marca"></span>
<br>

            <div class="linha">
                <div>
                    <label for="preco">Preço:</label>
                      <input type="text" id="preco">
                    <span class="erro" id="erro-preco"></span>
                </div>
              <div>
                    <label for="estoque">Quantidade:</label>
                    <input type="text" id="estoque">
                    <span class="erro" id="erro-estoque"></span>
              </div>
            </div>


            <div class="botoes">
                <button type="submit">Cadastrar Produto</button>
                <a class="botao" href="index.html">Voltar</a>
            </div>
            
            <div id="mensagem" class="mensagem"></div>
        </form>
    </main>


    <footer>GameStorage - Projeto Integrador</footer>

    <script src="js/dados.js"></script>
    <script src="js/validacao.js"></script>
    <script src="js/produto.js"></script>
</body>
</html>
